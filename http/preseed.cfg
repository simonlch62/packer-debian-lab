# ============================================================
# Preseed Debian 13 (Trixie) — Installation automatisée
# ============================================================

# ─── Langue & locale ─────────────────────────────────────────
d-i debian-installer/locale     string fr_FR.UTF-8
d-i debian-installer/language   string fr
d-i debian-installer/country    string FR

# ─── Clavier AZERTY ──────────────────────────────────────────
d-i keyboard-configuration/xkb-keymap  select fr
d-i keyboard-configuration/layoutcode  string fr
d-i keyboard-configuration/variantcode string

# Clavier console (TTY) — sans ce bloc la console reste en QWERTY
d-i console-setup/ask_detect   boolean false
d-i console-setup/layoutcode   string  fr
d-i console-setup/variantcode  string
d-i console-setup/charmap47    select  UTF-8

# ─── Réseau (DHCP automatique) ───────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname     string debian
d-i netcfg/get_domain       string local
d-i netcfg/wireless_wep_key_type select open

# Pas de question sur les firmwares manquants
d-i hw-detect/load_firmware boolean false

# ─── Miroir APT ──────────────────────────────────────────────
d-i mirror/country           string FR
d-i mirror/http/hostname     string deb.debian.org
d-i mirror/http/directory    string /debian
d-i mirror/http/proxy        string
d-i mirror/suite             string trixie

# Dépôts non-free et contrib (utile pour firmware VMware, etc.)
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free              boolean true
d-i apt-setup/contrib               boolean true

# ─── Horloge & fuseau horaire ─────────────────────────────────
d-i clock-setup/utc  boolean true
d-i time/zone        string Europe/Paris
d-i clock-setup/ntp  boolean true

# ─── Partitionnement (LVM automatique sur /dev/sda) ──────────
d-i partman-auto/disk                        string /dev/sda
d-i partman-auto/method                      string lvm
d-i partman-lvm/device_remove_lvm           boolean true
d-i partman-md/device_remove_md             boolean true
d-i partman-lvm/confirm                     boolean true
d-i partman-lvm/confirm_nooverwrite         boolean true
d-i partman-auto-lvm/guided_size            string max
d-i partman-auto/choose_recipe              select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition                select finish
d-i partman/confirm                         boolean true
d-i partman/confirm_nooverwrite             boolean true

# ─── Comptes utilisateurs ─────────────────────────────────────

# root : mot de passe "root"
d-i passwd/root-login           boolean true
d-i passwd/root-password        password root
d-i passwd/root-password-again  password root

# student : mot de passe "root", ajouté au groupe sudo
d-i passwd/make-user              boolean true
d-i passwd/user-fullname          string  Student
d-i passwd/username               string  student
d-i passwd/user-password          password root
d-i passwd/user-password-again    password root
d-i passwd/user-default-groups    string  audio cdrom video sudo

# ─── Sélection des paquets ────────────────────────────────────
tasksel tasksel/first multiselect standard

# Paquets supplémentaires
d-i pkgsel/include              string openssh-server sudo nano wget open-vm-tools htop net-tools dnsutils bash-completion tree traceroute nmap sysstat lsof rsync tar
d-i pkgsel/upgrade              select full-upgrade
d-i pkgsel/install-language-support boolean false

# Pas de rapport de popularité
popularity-contest popularity-contest/participate boolean false

# ─── Chargeur de démarrage GRUB ──────────────────────────────
d-i grub-installer/only_debian  boolean true
d-i grub-installer/with_other_os boolean false
# En mode EFI, GRUB s'installe sur la partition EFI — bootdev non nécessaire

# ─── Commandes post-installation ─────────────────────────────
# 1. Autoriser la connexion SSH en root (PermitRootLogin yes)
# 2. Ajouter un fichier sudoers drop-in pour student (NOPASSWD optionnel)
d-i preseed/late_command string \
    in-target sed -i 's/^[#]*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config ; \
    in-target bash -c "grep -q '^PermitRootLogin' /etc/ssh/sshd_config || echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config"

# ─── Fin d'installation ───────────────────────────────────────
d-i finish-install/reboot_in_progress note
